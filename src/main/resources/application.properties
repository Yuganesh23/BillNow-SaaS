spring.application.name=Billing

# Database (PostgreSQL / Neon in production, MySQL locally)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartbill}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# WHATSAPP CONFIGURATION (MSG91 & META)
# =====================================================

# Provider: 'msg91' (default) or 'meta'
whatsapp.provider=${WHATSAPP_PROVIDER:msg91}

# MSG91 WhatsApp Outbound API
msg91.whatsapp.api-url=${MSG91_WHATSAPP_API_URL:https://api.msg91.com/api/v5/whatsapp/whatsapp-outbound-message/bulk/}
msg91.whatsapp.authkey=${MSG91_AUTHKEY:562890AIne6oBFlfL6a9682ecP1}
msg91.whatsapp.integrated-number=${MSG91_INTEGRATED_NUMBER:15553413072}
msg91.whatsapp.sender-number=${MSG91_SENDER_NUMBER:9080824626}
msg91.whatsapp.namespace=${MSG91_NAMESPACE:f2e44b63_7a0b_4633_9ef1_6f732c68c329}
msg91.whatsapp.template-name=${MSG91_TEMPLATE_NAME:invoice_pdf}
msg91.whatsapp.language=${MSG91_LANGUAGE:en}

# Meta WhatsApp Cloud API (legacy fallback)
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com}
whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
secrets.encryption-key=${WHATSAPP_TOKEN_ENCRYPTION_KEY:}

# Server
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
# RAZORPAY
# =========================================================

razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_Trpfx7nVlsoQMQ}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:klW0OcordgX8SuglptVADXK9}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:klW0OcordgX8SuglptVADXK9}

# Razorpay Plan IDs
razorpay.monthly-plan-id=plan_xxxxxxxxxxxxx
razorpay.yearly-plan-id=plan_yyyyyyyyyyyyy

# =========================================================
# RESEND EMAIL SERVICE (Verified Domain: xenfirm.com)
# =========================================================
spring.mail.host=${RESEND_SMTP_HOST:smtp.resend.com}
spring.mail.port=${RESEND_SMTP_PORT:465}
spring.mail.username=${RESEND_SMTP_USERNAME:resend}
spring.mail.password=${RESEND_API_KEY:}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com

resend.from-email=${RESEND_FROM_EMAIL:XenBill <billing@xenfirm.com>}

# CORS Configuration for Production
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,https://xenbill.web.app,https://xenbill.firebaseapp.com
