spring.application.name=Billing

# PostgreSQL (Neon in production)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartbill}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.pattern.level=%5p [requestId:%X{requestId:-none}]

# =====================================================
# WHATSAPP CLOUD API
# =====================================================

whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com}
#It must be an actual Graph API version supported by Meta.
whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}

# India country code
whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
secrets.encryption-key=${WHATSAPP_TOKEN_ENCRYPTION_KEY:}

# Server
server.port=${PORT:8083}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# =========================================================
# RAZORPAY
# =========================================================

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# Razorpay Plan IDs
razorpay.monthly-plan-id=${RAZORPAY_MONTHLY_PLAN_ID}
razorpay.yearly-plan-id=${RAZORPAY_YEARLY_PLAN_ID}
razorpay.base-yearly-plan-id=${RAZORPAY_BASE_YEARLY_PLAN_ID}
razorpay.pro-yearly-plan-id=${RAZORPAY_PRO_YEARLY_PLAN_ID}
razorpay.enterprise-yearly-plan-id=${RAZORPAY_ENTERPRISE_YEARLY_PLAN_ID}
# Mock Email Config so app doesn't crash
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
mail.from=${MAIL_FROM:noreply@billnow.com}

# CORS Configuration for Production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Authentication cookie. Enable Secure when TLS terminates at the app or proxy.
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:7}
auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
auth.rate-limit.login.ip-max=${AUTH_RATE_LIMIT_LOGIN_IP_MAX:20}
auth.rate-limit.login.email-max=${AUTH_RATE_LIMIT_LOGIN_EMAIL_MAX:10}
auth.rate-limit.forgot-password.ip-max=${AUTH_RATE_LIMIT_FORGOT_IP_MAX:10}
auth.rate-limit.forgot-password.email-max=${AUTH_RATE_LIMIT_FORGOT_EMAIL_MAX:3}
auth.rate-limit.reset-password.ip-max=${AUTH_RATE_LIMIT_RESET_IP_MAX:10}
auth.rate-limit.reset-password.email-max=${AUTH_RATE_LIMIT_RESET_EMAIL_MAX:5}
auth.rate-limit.register.ip-max=${AUTH_RATE_LIMIT_REGISTER_IP_MAX:5}

# Keep the JWT secret outside source control in every deployed environment.
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
auth.otp-hmac-secret=${OTP_HMAC_SECRET:${jwt.secret}}

# Liveness/readiness endpoint used by containers and hosting platforms.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Neon Object Storage (private bucket; credentials use standard AWS_* variables)
storage.enabled=${STORAGE_ENABLED:false}
storage.endpoint=${AWS_ENDPOINT_URL_S3:http://localhost:9000}
storage.region=${AWS_REGION:aws-ap-southeast-1}
storage.bucket=${STORAGE_BUCKET:uploads}

# Automated reminders are opt-in and require configured email/WhatsApp providers.
billing.reminders.enabled=${BILLING_REMINDERS_ENABLED:false}
billing.reminders.cron=${BILLING_REMINDERS_CRON:0 0 9 * * *}

# Configurable because GST classification thresholds change and require CA review.
reports.gst.b2cl-threshold=${REPORTS_GST_B2CL_THRESHOLD:250000.00}

# Compliance is opt-in per shop. Mock mode is only for local/test environments.
compliance.provider=${COMPLIANCE_PROVIDER:mock}
compliance.mock-enabled=${COMPLIANCE_MOCK_ENABLED:true}

# Days of continued plan access after a failed renewal charge (0 = none).
billing.subscription.failed-payment-grace-days=${BILLING_FAILED_PAYMENT_GRACE_DAYS:0}

# Product limits are configuration so commercial packaging can change without code changes.
billing.plan-limits.trial.invoices-per-month=${BILLING_LIMIT_TRIAL_INVOICES:25}
billing.plan-limits.base.invoices-per-month=${BILLING_LIMIT_BASE_INVOICES:250}
billing.plan-limits.pro.invoices-per-month=${BILLING_LIMIT_PRO_INVOICES:2000}
billing.plan-limits.enterprise.invoices-per-month=${BILLING_LIMIT_ENTERPRISE_INVOICES:100000}
billing.plan-limits.trial.users=${BILLING_LIMIT_TRIAL_USERS:1}
billing.plan-limits.base.users=${BILLING_LIMIT_BASE_USERS:2}
billing.plan-limits.pro.users=${BILLING_LIMIT_PRO_USERS:10}
billing.plan-limits.enterprise.users=${BILLING_LIMIT_ENTERPRISE_USERS:100}
billing.plan-limits.trial.branches=${BILLING_LIMIT_TRIAL_BRANCHES:1}
billing.plan-limits.base.branches=${BILLING_LIMIT_BASE_BRANCHES:1}
billing.plan-limits.pro.branches=${BILLING_LIMIT_PRO_BRANCHES:5}
billing.plan-limits.enterprise.branches=${BILLING_LIMIT_ENTERPRISE_BRANCHES:100}

# Short-lived, revocable customer invoice portal links.
customer-portal.access-hours=${CUSTOMER_PORTAL_ACCESS_HOURS:72}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Authenticated API reference on the backend service.
springdoc.swagger-ui.disable-swagger-default-url=true
