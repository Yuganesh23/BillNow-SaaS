spring.application.name=Billing

# =========================================================
# DATABASE CONFIGURATION
# Production: Neon PostgreSQL via DATABASE_URL (Cloud Run Secret Manager)
# Supports both:
#   1. Neon standard RFC 3986 URI: postgresql://user:pass@host/neondb?sslmode=require
#   2. Standard JDBC format: jdbc:postgresql://host/neondb?sslmode=require
# Fallback: SPRING_DATASOURCE_URL
# =========================================================
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - PostgreSQL dialect & schema management
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool (Optimized for Neon serverless & Cloud Run concurrency)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=XenBillHikariPool

