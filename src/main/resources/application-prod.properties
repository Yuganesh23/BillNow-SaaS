# DATABASE_URL accepts Neon's standard postgresql:// URL (with embedded credentials)
# or a jdbc:postgresql:// URL with DATABASE_USERNAME and DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
jwt.secret=${JWT_SECRET}
auth.otp-hmac-secret=${OTP_HMAC_SECRET:${JWT_SECRET}}
secrets.encryption-key=${WHATSAPP_TOKEN_ENCRYPTION_KEY}
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.monthly-plan-id=${RAZORPAY_MONTHLY_PLAN_ID}
razorpay.yearly-plan-id=${RAZORPAY_YEARLY_PLAN_ID}
razorpay.base-yearly-plan-id=${RAZORPAY_BASE_YEARLY_PLAN_ID}
razorpay.pro-yearly-plan-id=${RAZORPAY_PRO_YEARLY_PLAN_ID}
razorpay.enterprise-yearly-plan-id=${RAZORPAY_ENTERPRISE_YEARLY_PLAN_ID}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.mode=${AUTH_COOKIE_MODE:split}
management.health.mail.enabled=false
compliance.mock-enabled=${COMPLIANCE_MOCK_ENABLED:false}
app.frontend-url=${FRONTEND_URL}
