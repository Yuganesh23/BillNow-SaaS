name: XenBill Backend CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn --batch-mode clean package -DskipTests

  deploy:
    name: Deploy to Cloud Run
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/745445463674/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@xenbill.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: 'xenbill'

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy billnow-api \
            --source . \
            --region asia-south1 \
            --project xenbill
